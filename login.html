{% extends "base.html" %}
{% block title %}Admin Login — RentWheels{% endblock %}

{% block extra_css %}
<style>
.lp {
  min-height: calc(100vh - var(--nav) - 60px);
  display: flex; align-items: center; justify-content: center; padding: 40px 24px;
}
.lbox { width: 100%; max-width: 420px; animation: lUp 0.4s cubic-bezier(.16,1,.3,1) both; }
@keyframes lUp { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:none; } }
.lcard {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; padding: 38px 34px; box-shadow: var(--shadow-lg);
}
.l-icon {
  width: 62px; height: 62px;
  background: linear-gradient(135deg, var(--blue), #60a5fa);
  border-radius: 17px;
  display: flex; align-items: center; justify-content: center;
  font-size: 29px; margin: 0 auto 20px;
  box-shadow: 0 5px 20px rgba(37,99,235,0.35);
}
.lcard h1 { text-align:center; font-size:22px; font-weight:900; letter-spacing:-0.3px; margin-bottom:5px; }
.lcard .sub { text-align:center; color:var(--muted); font-size:14px; margin-bottom:28px; }
.iw { position:relative; }
.ii { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted2); font-size:14px; }
.iw .form-input { padding-left:38px; }
.demo {
  margin-top:20px; padding:13px 15px;
  background:var(--blue-lt); border:1px dashed rgba(37,99,235,0.25);
  border-radius:10px; text-align:center;
  font-size:13px; color:var(--muted); line-height:1.7;
}
.demo strong { color:var(--blue); }
.back { display:block; text-align:center; margin-top:14px; color:var(--muted); font-size:13px; }
.back a { color:var(--blue); font-weight:700; }
</style>
{% endblock %}

{% block content %}
<div class="lp">
  <div class="lbox">
    <div class="lcard">
      <div class="l-icon">🔐</div>
      <h1>Admin Login</h1>
      <p class="sub">Sign in to manage the fleet</p>

      <form method="POST" action="/login">
        <div class="form-group">
          <label class="form-label">Username</label>
          <div class="iw">
            <i class="fa fa-user ii"></i>
            <input class="form-input" type="text" name="username" placeholder="admin" required autofocus/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="iw">
            <i class="fa fa-lock ii"></i>
            <input class="form-input" type="password" name="password" placeholder="••••••" required/>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:4px;">
          <i class="fa fa-sign-in-alt"></i> Sign In
        </button>
      </form>

      <div class="demo">
        Credentials &nbsp;·&nbsp;
        <strong>Username:</strong> admin &nbsp;
        <strong>Password:</strong> admin123
      </div>
    </div>
    <div class="back">← <a href="/">Back to Home</a></div>
  </div>
</div>
{% endblock %}
